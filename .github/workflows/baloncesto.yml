name: Bot de Analisis Baloncesto Prepartido

on:
  schedule:
    # 13:18 UTC -> 08:18 AM Hora Colombia (Bloque Día)
    # 01:18 UTC -> 08:18 PM Hora Colombia (Bloque Noche/Madrugada)
    - cron: '18 13,1 * * *'
  workflow_dispatch:

jobs:
  analisis_baloncesto:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # <-- Límite de seguridad: Cancela si supera los 5 minutos
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pydantic

      - name: Ejecutar motor de Baloncesto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python analisis_baloncesto_diario.py
